backend:
  name: github
  repo: lannke/acmjl-sveltia
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Accueil
        file: content/pages/home.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: headline
            label: Accroche
            widget: string
          - name: hero_image
            label: Image Hero
            widget: image
          - name: video
            label: Video embed
            widget: text
            required: false
          - name: quote
            label: Citation
            widget: string
          - name: body
            label: Texte presentation
            widget: markdown
          - name: body_bio
            label: Bio Jenny Lorant
            widget: markdown
          - name: image_bio
            label: Photo Jenny
            widget: image
          - name: gallery
            label: Galerie photos
            widget: list
            field:
              name: image
              label: Image
              widget: image
          - name: eleves_headline
            label: Titre section eleves
            widget: string

  - name: ateliers
    label: Ateliers
    folder: content/ateliers
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Titre
        widget: string
      - name: badge
        label: Badge
        widget: string
        required: false
      - name: prix
        label: Prix
        widget: string
      - name: horaires
        label: Horaires
        widget: string
      - name: periode
        label: Periode
        widget: string
      - name: lieu
        label: Lieu
        widget: string
      - name: contenu
        label: Contenu
        widget: list
        field:
          name: item
          label: Item
          widget: string
      - name: spectacle
        label: Spectacle
        widget: string
        required: false
      - name: inclus
        label: Inclus
        widget: list
        field:
          name: item
          label: Item
          widget: string
        required: false
      - name: conditions
        label: Conditions
        widget: list
        field:
          name: item
          label: Item
          widget: string
        required: false
      - name: status
        label: Status
        widget: select
        options:
          - label: Ouvert
            value: open
          - label: Complet
            value: complet
          - label: Ferme
            value: closed
      - name: body
        label: Description
        widget: markdown
        required: false

  - name: professeurs
    label: Professeurs
    folder: content/professeurs
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Nom
        widget: string
      - name: fonction
        label: Fonction
        widget: string
      - name: image
        label: Photo
        widget: image
        required: false
      - name: body
        label: Biographie
        widget: markdown

  - name: eleves
    label: Anciens eleves
    folder: content/eleves
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Nom
        widget: string
      - name: image
        label: Photo
        widget: image
      - name: credit
        label: Credit photo
        widget: string
        required: false
      - name: body
        label: Biographie
        widget: markdown

  - name: events
    label: Spectacles
    folder: content/events
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Titre
        widget: string
      - name: groupe
        label: Groupe
        widget: string
      - name: dates
        label: Dates
        widget: list
        field:
          name: date
          label: Date
          widget: string
      - name: image
        label: Affiche
        widget: image
        required: false
      - name: reservations
        label: Email reservations
        widget: string
        required: false
      - name: status
        label: Status
        widget: select
        options:
          - label: A venir
            value: a_venir
          - label: Passe
            value: passe
      - name: body
        label: Description
        widget: markdown
        required: false

  - name: lieux
    label: Lieux
    folder: content/lieux
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Nom
        widget: string
      - name: adresse
        label: Adresse
        widget: text
